name: تحديث الأفلام تلقائيًا

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch movies and resolve QFilm players
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          AFFILIATE_URL: ${{ secrets.AFFILIATE_URL }}
          PLATFORM_NAME: ${{ secrets.PLATFORM_NAME }}
          QFILM_BASE_URL: https://a.qfilm.tv
          QFILM_ENABLED: "true"
          QFILM_TIMEOUT: "20"
        run: |
          python auto_fetch.py

      - name: Commit and push if changed
        run: |
          git config user.name "arbflix-bot"
          git config user.email "bot@arbflix.site"
          git add movies-data.json sitemap.xml
          git diff --staged --quiet || git commit -m "تحديث الأفلام وروابط QFilm $(date +'%Y-%m-%d')"
          git push
