name: تحديث الأفلام تلقائيًا

on:
  schedule:
    - cron: '0 6 * * *'   # كل يوم الساعة ٦ صباحًا UTC (٨ صباحًا بتوقيت مصر)
  workflow_dispatch: {}   # زرار تشغيل يدوي من تبويب Actions لو عايز تجرب فورًا

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest movies from TMDb
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          AFFILIATE_URL: ${{ secrets.AFFILIATE_URL }}
          PLATFORM_NAME: ${{ secrets.PLATFORM_NAME }}
        run: python auto_fetch.py

      - name: Commit and push if changed
        run: |
          git config user.name "arbflix-bot"
          git config user.email "bot@arbflix.site"
          git add movies-data.json
          git diff --staged --quiet || git commit -m "تحديث تلقائي للأفلام $(date +'%Y-%m-%d')"
          git push
